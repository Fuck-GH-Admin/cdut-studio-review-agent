name: D3-MD-Q1 Third Party Isolated Integration Audit
on:
  pull_request:
    paths:
      - '.github/workflows/d3-md-q1-third-party-audit.yml'
      - 'docs/design/review-agent/acceptance/d3-md-full/auditor/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-a-b-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      AGENT_A_SHA: f8d95c4f7fe995ee55cbdfe15f16e95f514c0333
      AGENT_B_SHA: fbf0ee1e072f790e1d7957cfef80d869d6b5aa91
    steps:
      - uses: actions/checkout@v4
        with:
          path: auditor
      - uses: actions/checkout@v4
        with:
          ref: f8d95c4f7fe995ee55cbdfe15f16e95f514c0333
          path: agent-a
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fbf0ee1e072f790e1d7957cfef80d869d6b5aa91
          path: agent-b
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record both independently pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C agent-a rev-parse HEAD)" = "$AGENT_A_SHA"
          test "$(git -C agent-b rev-parse HEAD)" = "$AGENT_B_SHA"
          mkdir -p "$RUNNER_TEMP/md-q1-third-party"
          printf 'agentA=%s\nagentB=%s\n' "$AGENT_A_SHA" "$AGENT_B_SHA" > "$RUNNER_TEMP/md-q1-third-party/head-lock.txt"
      - name: Install pinned A dependencies
        working-directory: agent-a
        run: bun install --frozen-lockfile
      - name: Independently rerun A real D1/D2/D3 technical authoring and export/import
        working-directory: agent-a
        shell: bash
        run: |
          set -euo pipefail
          bash docs/design/review-agent/acceptance/d3-md-full/agent-author/tests/replay-technical.sh "$RUNNER_TEMP/md-q1-third-party/agent-a-runtime"
      - name: Independently rerun B oracle structural tests
        working-directory: agent-b
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/design/review-agent/acceptance/d3-md-full/agent-oracle/check_oracle.py \
            --output "$RUNNER_TEMP/md-q1-third-party/agent-b-oracle.json"
      - name: Third party independently reconcile all 103 source duties and 77 actual D2 Checks
        shell: bash
        run: |
          set -euo pipefail
          python3 auditor/docs/design/review-agent/acceptance/d3-md-full/auditor/third_party_md_cross_audit.py \
            --author agent-a/docs/design/review-agent/acceptance/d3-md-full/agent-author \
            --oracle agent-b/docs/design/review-agent/acceptance/d3-md-full/agent-oracle \
            --plan "$RUNNER_TEMP/md-q1-third-party/agent-a-runtime/actual-d2-plan.json" \
            --output "$RUNNER_TEMP/md-q1-third-party/cross-audit.json"
      - name: Third-party actual Pi Case/Run guard probes on four independent B synthetic inputs
        working-directory: agent-a
        shell: bash
        env:
          MDQ1_B_INPUT_ROOT: ${{ github.workspace }}/agent-b/docs/design/review-agent/acceptance/d3-md-full/agent-oracle
          MDQ1_PI_OUTPUT_DIR: ${{ runner.temp }}/md-q1-third-party/pi-high-risk
        run: |
          set -euo pipefail
          cp ../auditor/docs/design/review-agent/acceptance/d3-md-full/auditor/pi-high-risk-probe.test.ts \
            apps/electron/src/main/lib/review/third-party-mdq1-pi.test.ts
          bun test --isolate --timeout 60000 apps/electron/src/main/lib/review/third-party-mdq1-pi.test.ts \
            2>&1 | tee "$RUNNER_TEMP/md-q1-third-party/pi-high-risk-test.log"
      - name: Upload original logs, compiled plans and independent cross-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-md-q1-third-party-audit
          path: |
            ${{ runner.temp }}/md-q1-third-party/
          retention-days: 14
