name: Review batch focused tests

on:
  pull_request:
    paths:
      - 'packages/shared/src/review/batch-review-triage*'
      - 'apps/electron/src/main/lib/review/batch-store*'
      - 'apps/electron/src/renderer/components/content-review/BatchPanel.tsx'
      - '.github/workflows/review-batch-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-batch:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Batch triage and queue regression tests
        run: bun test --isolate --timeout 30000 packages/shared/src/review/batch-review-triage.test.ts apps/electron/src/main/lib/review/batch-store.test.ts
