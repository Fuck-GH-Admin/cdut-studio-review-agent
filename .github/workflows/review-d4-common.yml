name: D4 COMMON-01-02 runtime evidence
on:
  pull_request:
    paths:
      - 'packages/shared/src/types/review-*.ts'
      - 'apps/electron/src/main/lib/review/**'
      - '.github/workflows/review-d4-common.yml'
      - 'docs/design/review-agent/acceptance/d4-common-r2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      D4_RUNTIME_EVIDENCE_DIR: ${{ github.workspace }}/d4-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: node apps/electron/scripts/review-d3-r0-verify.cjs
      - run: bun test --isolate --timeout 60000 apps/electron/src/main/lib/review/review-d4-common.test.ts apps/electron/src/main/lib/review/review-d3-r1-student.test.ts
      - run: bun test --isolate --timeout 60000 apps/electron/src/main/lib/review/review-d2-runtime.test.ts apps/electron/src/main/lib/review/review-d2-execution-gates.test.ts apps/electron/src/main/lib/review/review-authoring-v1.test.ts apps/electron/src/main/lib/review/review-d3-handoff.test.ts apps/electron/src/main/lib/review/review-d3-pi-integration.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d4-common-r2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: d4-evidence/
          retention-days: 30
