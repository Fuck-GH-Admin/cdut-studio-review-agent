name: P06 L02-U0 exact main candidate evidence

on:
  pull_request:
    paths:
      - '.github/workflows/p06-l02-u0-frozen-candidate.yml'
      - 'apps/electron/src/main/lib/review/review-office-v2-sourceref-boundary.l02.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Exact integrated main tree / independent gates
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run detached fixed-tree gate with first-failure evidence
        shell: bash
        run: |
          set +e -u -o pipefail
          EXPECTED_COMMIT='8989941b6fb5651564e32d11c4215b6a6d5a5209'
          EXPECTED_TREE='b3df4773afc20ee46facd2366f35c5a78ee99e98'
          ROOT="$RUNNER_TEMP/p06-l02-u0-$GITHUB_RUN_ID"
          CANDIDATE="$ROOT/candidate"
          OUT="$GITHUB_WORKSPACE/p06-l02-u0-gate-artifacts"
          mkdir -p "$ROOT" "$OUT/logs"
          : > "$OUT/commands.tsv"
          : > "$OUT/first-failure.txt"
          printf 'candidate_commit=%s\ncandidate_tree=%s\n' "$EXPECTED_COMMIT" "$EXPECTED_TREE" > "$OUT/expected.txt"
          trap 'if test -d "$CANDIDATE"; then git worktree remove --force "$CANDIDATE" >/dev/null 2>&1 || true; fi' EXIT
          record() {
            local label="$1"; shift
            local start rc finish
            start="$(date -u +%FT%TZ)"
            "$@" > "$OUT/logs/$label.log" 2>&1
            rc=$?
            finish="$(date -u +%FT%TZ)"
            printf '%s\t%s\t%s\t%s\n' "$label" "$rc" "$start" "$finish" >> "$OUT/commands.tsv"
            if test "$rc" -ne 0 && ! test -s "$OUT/first-failure.txt"; then
              printf 'label=%s\nexit_code=%s\n' "$label" "$rc" > "$OUT/first-failure.txt"
            fi
            printf '%s exit=%s\n' "$label" "$rc"
          }
          finish() {
            local verdict="$1"
            printf '%s\n' "$verdict" > "$OUT/verdict.txt"
            EVIDENCE_ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['EVIDENCE_ROOT'])
          commands=[]
          for row in (root/'commands.tsv').read_text().splitlines():
              parts=row.split('\t')
              if len(parts)==4: commands.append({'name':parts[0], 'exitCode':int(parts[1]), 'startedUTC':parts[2], 'endedUTC':parts[3]})
          digests={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name not in ('manifest.json','sha256.json')}
          data={'candidateCommit':'8989941b6fb5651564e32d11c4215b6a6d5a5209','candidateTree':'b3df4773afc20ee46facd2366f35c5a78ee99e98','verdict':(root/'verdict.txt').read_text().strip(),'firstFailure':(root/'first-failure.txt').read_text().strip() or None,'commands':commands,'filesSHA256':digests,'officeIssue71':'DEFERRED_FIX','u1Live':'NOT_RUN','historicGoldUnmodified':True}
          (root/'manifest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          (root/'sha256.json').write_text(json.dumps(digests,sort_keys=True,indent=2)+'\n')
          PY
          }
          record 00-worktree git worktree add --detach "$CANDIDATE" "$EXPECTED_COMMIT"
          if ! test -f "$CANDIDATE/package.json"; then finish 'BLOCKED_WORKTREE'; exit 2; fi
          record 01-identity bash -c 'cd "$1"; test "$(git rev-parse HEAD)" = "$2" && test "$(git rev-parse HEAD^{tree})" = "$3" && git rev-parse HEAD && git rev-parse HEAD^{tree}' _ "$CANDIDATE" "$EXPECTED_COMMIT" "$EXPECTED_TREE"
          if ! grep -q $'^01-identity\t0\t' "$OUT/commands.tsv"; then finish 'BLOCKED_SHA_TREE_MISMATCH'; exit 2; fi
          record 02-versions bash -c 'git --version; node --version; bun --version; python3 --version'
          record 03-install bash -c 'cd "$1" && bun install --frozen-lockfile' _ "$CANDIDATE"
          record 03a-cli-status git -C "$CANDIDATE" status --porcelain -- apps/cli/src/index.ts
          if ! grep -q $'^03-install\t0\t' "$OUT/commands.tsv"; then finish 'BLOCKED_FROZEN_INSTALL'; exit 1; fi
          record 04-typecheck bash -c 'cd "$1" && bun run typecheck' _ "$CANDIDATE"
          record 04a-cli-status git -C "$CANDIDATE" status --porcelain -- apps/cli/src/index.ts
          record 05-boundaries bash -c 'cd "$1" && bun run check:boundaries' _ "$CANDIDATE"
          record 06-skin bash -c 'cd "$1/apps/electron" && bun run check:skin-contract' _ "$CANDIDATE"
          record 07-main-build bash -c 'cd "$1/apps/electron" && bun run build:main' _ "$CANDIDATE"
          record 08-preload-build bash -c 'cd "$1/apps/electron" && bun run build:preload' _ "$CANDIDATE"
          record 09-renderer-build bash -c 'cd "$1/apps/electron" && bun run build:renderer' _ "$CANDIDATE"
          record 09a-cli-status git -C "$CANDIDATE" status --porcelain -- apps/cli/src/index.ts
          record 10-focused bash -c 'cd "$1" && bun test --isolate --timeout 30000 packages/core/src/office-engine/office-engine.test.ts apps/electron/src/main/lib/document-parse-tools.test.ts apps/electron/src/main/lib/review/document-service.test.ts apps/electron/src/main/lib/review/review-strict-profile.p02.probe.test.ts apps/electron/src/main/lib/review/review-pi-run-bridge.main.test.ts apps/electron/src/main/lib/review/pi-case-review-service.test.ts apps/electron/src/renderer/lib/agent-tab-access.test.ts apps/electron/src/renderer/components/content-review/review-workspace-recheck-independent.test.ts' _ "$CANDIDATE"
          record 10a-cli-status git -C "$CANDIDATE" status --porcelain -- apps/cli/src/index.ts
          record 11-full bash -c 'cd "$1" && bun test --isolate --timeout 30000' _ "$CANDIDATE"
          record 11a-cli-status git -C "$CANDIDATE" status --porcelain -- apps/cli/src/index.ts
          record 12-git-status git -C "$CANDIDATE" status --porcelain
          record 13-tracked-diff git -C "$CANDIDATE" diff -- apps/cli/src/index.ts
          record 14-clean-gate bash -c 'cd "$1"; test -z "$(git status --porcelain)"' _ "$CANDIDATE"
          if test -s "$OUT/first-failure.txt"; then finish 'FAIL_KEEP_FIRST_FAILURE'; exit 1; fi
          finish 'EXACT_MAIN_BUILD_AND_TEST_GATES_PASS_U1_NOT_RUN'
      - name: Upload U0 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p06-l02-u0-exact-main-evidence
          path: p06-l02-u0-gate-artifacts/
          retention-days: 30
          if-no-files-found: warn
